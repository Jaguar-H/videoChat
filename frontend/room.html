<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoChat — Room</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="call-page">
    <div id="call-main">
      <div id="call-header">
        <div id="header-left">
          <h2 id="room-name-display">Room</h2>
          <div id="status-bar">
            <span class="status-dot connecting" id="status-dot"></span>
            <span id="status-text">Connecting...</span>
          </div>
        </div>
        <span id="room-id-badge"></span>
      </div>

      <div id="video-grid"></div>

      <div id="controls">
        <button class="btn-icon active" id="mic-btn" title="Toggle microphone">
          <svg id="mic-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button class="btn-icon active" id="cam-btn" title="Toggle camera">
          <svg id="cam-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.82v6.362a1 1 0 0 1-1.447.888L15 14"/><rect x="1" y="6" width="14" height="12" rx="2"/></svg>
        </button>
        <button class="btn-icon active" id="flip-btn" title="Switch camera" style="display:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10"/><path d="M3.51 15a9 9 0 0 0 14.85 3.36L23 14"/></svg>
        </button>
        <div class="ctrl-divider"></div>
        <button class="btn-danger" id="leave-btn">Leave</button>
      </div>
    </div>

    <div id="chat-panel">
      <div id="chat-header">
        Chat
        <button id="chat-toggle" title="Toggle chat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="Message…" maxlength="500" autocomplete="off" />
        <button id="chat-send" class="btn-primary">Send</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/room.js"></script>
</body>
</html>
